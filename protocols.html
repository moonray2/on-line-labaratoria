<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Локальный архив — лаборатория</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">Лаборатория онлайн</div><nav><a href="index.html">Главная</a><a href="gost-1497.html">ГОСТ 1497</a><a class="active" href="protocols.html">Архив</a></nav></header><main class="container"><h1>Черновики протоколов</h1><p>Данные хранятся только в этом браузере. При очистке данных сайта они будут удалены.</p><ul id="protocolList"></ul><button id="clearBtn" class="btn-secondary">Очистить локальный архив</button></main><script src="script.js"></script><script>async function render(){const list=await loadAllProtocols(),el=document.getElementById('protocolList');el.replaceChildren();if(!list.length){el.textContent='Нет сохранённых черновиков.';return;}for(const item of list){const li=document.createElement('li'),p=item.protocol;li.textContent=`${item.date.slice(0,19)} · ${p.sampleId||'образец без номера'} · ${p.material||'материал не указан'} · σв: ${p.sigmaB??'—'} МПа · σ₀.₂: ${p.sigmaYield??'—'} МПа · δ: ${p.delta??'—'} %`;el.append(li);}}render();document.getElementById('clearBtn').onclick=async()=>{if(confirm('Удалить все локальные черновики?')){await clearProtocols();render();}};</script></body></html>
